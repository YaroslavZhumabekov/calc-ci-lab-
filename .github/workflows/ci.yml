name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Установить зависимости
        run: |
          pip install -r requirements-dev.txt
          pip install black
          
      - name: Запустить black
        run: black --check src tests
        
      - name: Запустить flake8
        run: flake8 src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Установить зависимости
        run: pip install -r requirements-dev.txt
        
      - name: Запустить pytest
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Установить зависимости
        run: pip install -r requirements-dev.txt
        
      - name: Собрать пакет
        run: python -m build